<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Preview Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="bg-gray-100 p-6">
  <h1 class="text-2xl font-bold text-center mb-6">Hasil Foto Anda</h1>

  <div class="flex flex-col lg:flex-row justify-center gap-6">
    <div class="flex flex-col items-center">
      <canvas id="canvas" width="500" height="650" class="border rounded shadow"></canvas>
    </div>

    <div class="flex flex-col items-center justify-start mt-6 lg:mt-0">
      <button id="printBtn" class="bg-green-600 text-white font-bold py-2 px-6 rounded hover:bg-green-700 mb-4">
        Cetak Foto
      </button>
      <p class="text-gray-600 text-sm mb-2 text-center">
        Scan QR Code untuk unduh hasil
      </p>
      <canvas id="qrcode" class="bg-white p-2 rounded shadow"></canvas>
    </div>
  </div>

  <div id="overlay" class="fixed inset-0 bg-gray-100 text-gray-800 hidden flex items-center justify-center z-50">
    <div class="flex flex-col items-center">
      <h1 class="text-3xl font-semibold mb-4">Hasil Foto Anda</h1>
      <p class="mb-2 text-gray-600">Scan QR Code ini untuk download foto</p>
      <canvas id="finalQrCode" class="bg-white p-2 rounded shadow mb-4"></canvas>
      <p id="countdownText" class="text-sm text-gray-500">
        Mengalihkan ke halaman utama dalam <span id="counter">30</span> detik...
      </p>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const QRCode = require('qrcode');
    const path = require('path');

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const urlParams = new URLSearchParams(window.location.search);
    const frameId = urlParams.get("frame_id");
    const photoDataUrls = JSON.parse(localStorage.getItem("capturedPhotos") || "[]");

    let frameImage = null;
    let photos = [];
    let finalDownloadUrl = null;

    function getSlots() {
      return [
        { x: 50, y: 10, width: 400, height: 220 },
        { x: 50, y: 220, width: 400, height: 220 },
        { x: 50, y: 440, width: 400, height: 220 }
      ];
    }

    async function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject("Gagal load image: " + src);
        img.src = src;
      });
    }

    async function init() {
      try {
        // Load frame
        const response = await fetch(`http://127.0.0.1:8000/api/frames/${frameId}`);
        const data = await response.json();
        frameImage = await loadImage(data.image_url);

        // Load captured photos
        for (let url of photoDataUrls) {
          const img = await loadImage(url);
          photos.push(img);
        }

        drawAll();

        // Simpan ke lokal (Electron)
        const finalDataUrl = canvas.toDataURL("image/jpeg");
        const filePath = await ipcRenderer.invoke('save-final-photo', finalDataUrl);

        // Upload ke Laravel
        const upload = await fetch("http://127.0.0.1:8000/api/upload-final-photo", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            photo: finalDataUrl,
            filename: filePath.split('\\').pop()
          }),
        });

        if (!upload.ok) {
          alert("Gagal mengupload foto ke backend.");
          return;
        }

        const json = await upload.json();
        console.log("Upload sukses:", json);

        const laptopIp = "192.168.138.131"; // ganti ip sesuai ipconfig laptopmu
        const filename = json.filename;
        finalDownloadUrl = `http://${laptopIp}:8000/download/${filename}`;

        const qrCanvas = document.getElementById("qrcode");
        QRCode.toCanvas(qrCanvas, finalDownloadUrl, function (error) {
          if (error) console.error(error);
        });

      } catch (e) {
        alert("Gagal memuat gambar: " + e);
      }
    }

    function drawAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const slots = getSlots();
      for (let i = 0; i < photos.length && i < slots.length; i++) {
        const img = photos[i];
        const slot = slots[i];

        const scale = Math.max(slot.width / img.width, slot.height / img.height);
        const sw = slot.width / scale;
        const sh = slot.height / scale;
        const sx = (img.width - sw) / 2;
        const sy = (img.height - sh) / 2;

        ctx.drawImage(
          img,
          sx, sy, sw, sh,
          slot.x, slot.y,
          slot.width, slot.height
        );
      }

      if (frameImage) {
        ctx.drawImage(frameImage, 0, 0, canvas.width, canvas.height);
      }
    }

    document.getElementById("printBtn").addEventListener("click", async () => {
      // Tampilkan overlay
      const overlay = document.getElementById("overlay");
      const countdown = document.getElementById("counter");
      const finalQrCode = document.getElementById("finalQrCode");

      // QR Code di overlay
      QRCode.toCanvas(finalQrCode, finalDownloadUrl, err => {
        if (err) console.error("Gagal generate QR:", err);
      });

      overlay.classList.remove("hidden");

      let timeLeft = 30;
      countdown.textContent = timeLeft;

      const interval = setInterval(() => {
        timeLeft--;
        countdown.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(interval);
          window.location.href = "index.html";
        }
      }, 1000);
    });

    init();
  </script>
</body>
</html>
